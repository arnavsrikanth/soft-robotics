[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-generator"
version = "0.1.0"
description = "Validated millimeter-scale lattice solids for STL printing"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.14", "scikit-image>=0.25", "trimesh>=4.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lattice-generator = "lattice_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
